services:
  - type: web
    name: researchlens-ai
    env: python
    region: singapore
    plan: free
    buildCommand: grep -viE '^(sentence-transformers|torch|numpy)==' requirements.txt > requirements.render.txt && pip install -r requirements.render.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 300
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false            # paste the service-account JSON in the Render dashboard
      - key: APP_SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: GAPS_TARGET
        value: "50"
      - key: MAX_GAP_BATCHES
        value: "8"
    healthCheckPath: /health
    autoDeploy: true