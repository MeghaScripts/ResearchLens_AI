name: Release

# Create a release by pushing a tag that matches the VERSION file, e.g.:
#   edit VERSION to 1.1.0, update CHANGELOG.md, commit, then:  git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION file
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "$FILE" ]; then
            echo "Tag v$TAG does not match VERSION ($FILE)"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Run tests
        env:
          APP_SECRET_KEY: ci-test-secret
          FIREBASE_SERVICE_ACCOUNT_JSON: "{}"
        run: |
          grep -viE '^(sentence-transformers|torch|numpy)==' requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt pytest
          cd backend && python -m pytest tests -q -p no:cacheprovider

      - name: Extract release notes from CHANGELOG.md
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || echo "Release $V" > release_notes.md

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/researchlens-ai:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/researchlens-ai:latest
          build-args: |
            APP_COMMIT=${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          generate_release_notes: false
