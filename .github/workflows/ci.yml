name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (optional heavy ML packages skipped; app falls back to TF-IDF)
        run: |
          python -m pip install --upgrade pip
          grep -viE '^(sentence-transformers|torch|numpy)==' requirements.txt > requirements.ci.txt
          pip install -r requirements.ci.txt pytest
      - name: Syntax check
        run: python -m compileall -q backend
      - name: Run tests
        working-directory: backend
        env:
          APP_SECRET_KEY: ci-test-secret
          FIREBASE_SERVICE_ACCOUNT_JSON: "{}"
        run: python -m pytest tests -q -p no:cacheprovider

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t researchlens:ci .
      - name: Smoke test the container (/health and /ready)
        run: |
          docker run -d --name rl -p 8000:8000 -e APP_SECRET_KEY=ci -e FIREBASE_SERVICE_ACCOUNT_JSON='{}' researchlens:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/ready
          docker logs rl | tail -20
          docker rm -f rl

  deploy:
    # Continuous deployment: after tests + docker pass on main, trigger Render.
    # Add the secret RENDER_DEPLOY_HOOK_URL (Render > service > Settings > Deploy Hook) to enable it.
    needs: [test, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set - skipping deploy (Render auto-deploy may still apply)."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
