# Local run:  docker compose up --build      then open http://localhost:8000
services:
  web:
    build: .
    image: researchlens:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env            # optional; copy .env.example to .env and fill it in
        required: false
    environment:
      PORT: "8000"
      DB_PATH: /data/researchlens.db
      LOG_LEVEL: INFO
    volumes:
      - researchlens-data:/data
      - researchlens-uploads:/app/uploads
      - researchlens-reports:/app/reports
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  researchlens-data:
  researchlens-uploads:
  researchlens-reports:
